<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chesswise — Opening Explorer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♟️</text></svg>">
<style>
  /* Dark (Catppuccin Mocha) is the default regardless of OS
     preference — Mokka's look is a deliberate, chosen theme, not
     something that should silently flip to light just because the
     system prefers it. "System" in the theme-toggle cycle below
     therefore renders identically to "dark"; :root[data-theme="light"]
     is the only way to opt into the light (Latte) palette. */
  :root {
    color-scheme: dark;
    --surface-1: #1c2e3c;
    --surface-1-glass: rgba(28,46,60,0.72);
    --page-plane: #131f29;
    --text-primary: #dfe8ed;
    --text-secondary: #a8bcc7;
    --text-muted: #748994;
    --gridline: #2c4356;
    --baseline: #3c5b70;
    --border: rgba(223,232,237,0.14);
    --series-1: #7fabc4; /* muted sky blue — bar chart, lichess badge */
    --series-2: #d3a077; /* muted clay — chesscom badge, deliberate warm counterpoint */
    --status-critical: #e2707f; /* blunder */
    --status-critical-text: #2a0011;
    --status-serious: #e58f95; /* mistake */
    --status-warning: #e6bf78; /* inaccuracy */
    --status-good: #7fbd96;
    --accent: #6b9bb8; /* muted steel-sky accent */
    --accent-soft: rgba(107,155,184,0.18);
    --accent-glow: rgba(107,155,184,0.35);
    --board-selected: rgba(230,191,120,0.35);
    --board-dot: rgba(230,191,120,0.6);
    --tier-brilliant: #7fabc4;
    --tier-great: #6b9bb8;
    --tier-excellent: #7fc4b3;
    --tier-book: #74899d;
    --tier-miss: #d3a077;
    --bg-art: linear-gradient(180deg, #0f1922 0%, #16242f 55%, #1e3140 100%);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --surface-1: #ffffff;
    --surface-1-glass: rgba(255,255,255,0.75);
    --page-plane: #eef2f5;
    --text-primary: #2b3c46;
    --text-secondary: #57707d;
    --text-muted: #869aa5;
    --gridline: #d7e2e8;
    --baseline: #b3c5cf;
    --border: rgba(43,60,70,0.14);
    --series-1: #5a8aa6;
    --series-2: #cd8552;
    --status-critical: #c94d5f;
    --status-critical-text: #ffffff;
    --status-serious: #d4737f;
    --status-warning: #c68c33;
    --status-good: #4a9268;
    --accent: #4d84a3;
    --accent-soft: rgba(77,132,163,0.14);
    --accent-glow: rgba(77,132,163,0.28);
    --board-selected: rgba(198,140,51,0.32);
    --board-dot: rgba(43,60,70,0.45);
    --tier-brilliant: #3f7f9e;
    --tier-great: #4d84a3;
    --tier-excellent: #3f9384;
    --tier-book: #869aa5;
    --tier-miss: #cd8552;
    --bg-art: linear-gradient(180deg, #eef2f5 0%, #e3ebef 55%, #d7e2e8 100%);
  }

  /* Board square colors — same in both themes: a chess board's own colors
     don't change with the site's dark/light toggle any more than a
     physical board would. Quieter, more desaturated "overcast sky" blue
     rather than a bright, saturated web-app blue. */
  :root {
    --board-light: #e2ebf0;
    --board-dark: #7fa3bd;
  }

  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  .hidden { display: none !important; }
  .loading-disabled { pointer-events: none; opacity: 0.55; transition: opacity .15s; }
  body {
    margin: 0;
    min-height: 100vh;
    background-image: var(--bg-art);
    background-size: cover;
    background-position: bottom center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-color: var(--page-plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 28px 40px 64px;
  }
  .page { max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  header.top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  h1 { font-size: 20px; margin: 0; }
  nav.top-nav a {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 13px;
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    transition: background .15s, color .15s, border-color .15s;
  }
  nav.top-nav a:hover { background: var(--accent-soft); color: var(--text-primary); border-color: transparent; }
  nav.top-nav a.active { background: var(--accent); color: #fff; border-color: transparent; }
  .nav-dropdown { position: relative; display: inline-block; }
  .nav-dropdown-toggle {
    font: inherit; font-size: 13px; padding: 7px 14px; border: 1px solid var(--border);
    border-radius: 999px; background: none; color: var(--text-secondary); cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .nav-dropdown-toggle:hover { background: var(--accent-soft); color: var(--text-primary); border-color: transparent; }
  .nav-dropdown-toggle.active-section { background: var(--accent); color: #fff; border-color: transparent; }
  .nav-dropdown-menu {
    display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 30;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 6px; min-width: 150px; box-shadow: 0 12px 32px rgba(17,17,26,0.25);
  }
  .nav-dropdown.open .nav-dropdown-menu { display: block; }
  .nav-dropdown-menu a {
    display: block; padding: 8px 12px; border-radius: 8px; font-size: 13px;
    color: var(--text-secondary); text-decoration: none; white-space: nowrap;
  }
  .nav-dropdown-menu a:hover { background: var(--accent-soft); color: var(--text-primary); }
  .nav-dropdown-menu a.active { background: var(--accent); color: #fff; }
  .icon-btn {
    font: inherit; font-size: 15px; width: 34px; height: 34px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); cursor: pointer;
  }
  .icon-btn:hover:not(:disabled) { background: var(--accent-soft); border-color: transparent; }
  .card {
    background: var(--surface-1-glass);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    min-width: 0;
    box-shadow: 0 1px 2px rgba(17, 17, 26, 0.06), 0 24px 48px -24px var(--accent-glow);
  }

  .layout { display: grid; grid-template-columns: minmax(0, 680px) 1fr; gap: 24px; align-items: start; }
  @media (max-width: 1080px) { .layout { grid-template-columns: 1fr; } }

  .path-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; }
  .path-row button {
    font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 100px; border: 1px solid var(--border);
    background: var(--page-plane); color: var(--text-secondary); cursor: pointer;
  }
  .path-row .crumb { color: var(--text-primary); font-weight: 600; }
  .path-row .sep { color: var(--text-muted); }
  #reset-btn { margin-left: auto; }

  .board-frame {
    width: 100%; aspect-ratio: 1/1; border-radius: 10px; overflow: hidden; border: 1px solid var(--border);
  }
  #board {
    display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
    width: 100%; height: 100%; user-select: none;
  }
  .square { position: relative; display: flex; align-items: center; justify-content: center; font-size: min(6vw, 72px); cursor: pointer; }
  .square.light { background: var(--board-light); }
  .square.dark { background: var(--board-dark); }
  .square.selected::after { content: ""; position: absolute; inset: 0; background: var(--board-selected); }
  .square .legal-dot { position: absolute; width: 26%; height: 26%; border-radius: 50%; background: var(--board-dot); pointer-events: none; }
  /* Real piece silhouettes (the standard "cburnett" Staunton set — see
     the #piece-sprites <defs> near the top of <body>) instead of a
     system font's chess glyphs, colored via CSS text tricks. Colors are
     baked into the artwork here, so no CSS coloring is needed. */
  .piece-icon { width: 82%; height: 82%; display: block; overflow: visible; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.35)); pointer-events: none; }
  .board-with-evalbar { display: flex; gap: 12px; align-items: stretch; }
  .eval-bar-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 34px; flex-shrink: 0; }
  .eval-bar {
    width: 30px; flex: 1; border-radius: 6px; overflow: hidden; border: 1px solid var(--border);
    background: var(--surface-1); display: flex; flex-direction: column; justify-content: flex-end;
  }
  .eval-bar-fill { background: #f2f2f2; width: 100%; transition: height .25s ease; }
  .eval-bar-value { font-size: 11px; font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lines-caption { font-size: 12px; color: var(--text-muted); }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .stats-grid { grid-template-columns: 1fr; } }
  .panel-title { font-size: 13px; font-weight: 600; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
  .panel-title .dot { width: 9px; height: 9px; border-radius: 50%; }
  .panel-title .dot.mine { background: var(--series-1); }
  .panel-title .dot.community { background: var(--series-2); }

  .wdl-bar { display: flex; height: 20px; border-radius: 6px; overflow: hidden; margin: 8px 0; font-size: 0; }
  .wdl-bar span { display: block; height: 100%; }
  .wdl-bar .win { background: var(--status-good); }
  .wdl-bar .draw { background: var(--text-muted); }
  .wdl-bar .loss { background: var(--status-critical); }
  .wdl-caption { font-size: 12px; color: var(--text-secondary); }

  table.moves-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  table.moves-table th {
    text-align: left; font-size: 11px; text-transform: uppercase; color: var(--text-muted);
    font-weight: 600; padding: 0 8px 6px; border-bottom: 1px solid var(--gridline);
  }
  table.moves-table td { padding: 6px 8px; border-bottom: 1px solid var(--gridline); font-variant-numeric: tabular-nums; }
  table.moves-table tr.move-choice { cursor: pointer; }
  table.moves-table tr.move-choice:hover { background: var(--page-plane); }

  .divergence-card { border-left: 3px solid var(--status-warning); }
  .divergence-item { font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--gridline); }
  .divergence-item:last-child { border-bottom: none; }

  .empty-note { color: var(--text-secondary); font-size: 13px; }
  .loading-text { color: var(--text-secondary); font-size: 13px; }
  .spinner {
    display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite;
    vertical-align: -2px; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

    <symbol id="piece-bK" viewBox="0 0 45 45"><g fill="none" fill-rule="evenodd" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path stroke-linejoin="miter" d="M22.5 11.6V6"/><path fill="#000" stroke-linecap="butt" stroke-linejoin="miter" d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/><path fill="#000" d="M11.5 37a22.3 22.3 0 0 0 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10 5 10z"/><path stroke-linejoin="miter" d="M20 8h5"/><path stroke="#ececec" d="M32 29.5s8.5-4 6-9.7C34.1 14 25 18 22.5 24.6v2.1-2.1C20 18 9.9 14 7 19.9c-2.5 5.6 4.8 9 4.8 9"/><path stroke="#ececec" d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/></g></symbol>
  </defs>
</svg>

<div class="page">
  <header class="top">
    <h1>Opening Explorer</h1>
    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <nav class="top-nav">
        <a href="/">Dashboard</a>
        <a href="/puzzles">Puzzles</a>
        <div class="nav-dropdown">
          <button type="button" class="nav-dropdown-toggle active-section" aria-haspopup="true" aria-expanded="false">Train ▾</button>
          <div class="nav-dropdown-menu">
            <a href="/explorer" class="active">Explorer</a>
            <a href="/endgame">Endgame</a>
            <a href="/analyze">Analyze</a>
          </div>
        </div>
        <div class="nav-dropdown">
          <button type="button" class="nav-dropdown-toggle" aria-haspopup="true" aria-expanded="false">Insights ▾</button>
          <div class="nav-dropdown-menu">
            <a href="/insights">Insights</a>
            <a href="/clock">Clock</a>
            <a href="/progress">Progress</a>
          </div>
        </div>
        <a href="/search">Search</a>
      </nav>
      <a class="icon-btn" href="/profiles" title="Manage profiles" aria-label="Manage profiles" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center;">👤</a>
      <button class="icon-btn" id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
    </div>
  </header>

  <div class="card">
    <div class="path-row" id="path-row">
      <span class="crumb">Starting position</span>
      <button id="reset-btn">Reset</button>
    </div>
  </div>

  <div class="layout">
    <div class="card">
      <div class="board-with-evalbar">
        <div class="eval-bar-wrap">
          <div class="eval-bar"><div class="eval-bar-fill" id="explorer-eval-fill"></div></div>
          <span class="eval-bar-value" id="explorer-eval-value"></span>
        </div>
        <div class="board-frame"><div id="board"></div></div>
      </div>
      <p class="lines-caption" id="explorer-eval-caption" style="margin-top:8px;"></p>
    </div>

    <div style="display:flex; flex-direction:column; gap:16px;">
      <div class="card">
        <div class="stats-grid">
          <div>
            <p class="panel-title"><span class="dot mine"></span>My games</p>
            <div id="mine-summary"><span class="loading-text"><span class="spinner"></span>Loading…</span></div>
          </div>
          <div>
            <p class="panel-title"><span class="dot community"></span>Lichess community</p>
            <div id="community-summary"><span class="loading-text"><span class="spinner"></span>Loading…</span></div>
          </div>
        </div>
      </div>

      <div class="card hidden" id="divergence-card">
        <p class="panel-title">⚠ Worth a look</p>
        <div id="divergence-list"></div>
      </div>

      <div class="card">
        <p class="panel-title">Next moves</p>
        <table class="moves-table">
          <thead><tr><th>Move</th><th>My games</th><th>My win%</th><th>Community %</th><th>Community win%</th></tr></thead>
          <tbody id="moves-body"><tr><td colspan="5" class="empty-note">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  const PIECE_TYPE_LETTER = { k: "K", q: "Q", r: "R", b: "B", n: "N", p: "P" };
  const SVG_NS = "http://www.w3.org/2000/svg";
  const XLINK_NS = "http://www.w3.org/1999/xlink";
  function renderPieceIcon(container, piece) {
    const isWhite = piece === piece.toUpperCase();
    const svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("class", "piece-icon");
    svg.setAttribute("viewBox", "0 0 45 45");
    const use = document.createElementNS(SVG_NS, "use");
    const symbolId = `#piece-${isWhite ? "w" : "b"}${PIECE_TYPE_LETTER[piece.toLowerCase()]}`;
    use.setAttribute("href", symbolId);
    use.setAttributeNS(XLINK_NS, "xlink:href", symbolId);
    svg.appendChild(use);
    container.appendChild(svg);
  }
  let movePath = [];       // [{uci, san}, ...]
  let currentData = null;
  let selectedSquare = null;

  function fenToPieceMap(fen) {
    const rows = fen.split(" ")[0].split("/");
    const map = {};
    rows.forEach((row, r) => {
      const rank = 8 - r;
      let file = 0;
      for (const ch of row) {
        if (/\d/.test(ch)) { file += parseInt(ch, 10); }
        else { map[String.fromCharCode(97 + file) + rank] = ch; file += 1; }
      }
    });
    return map;
  }
  // --- Live Stockfish eval for whatever position the explorer is showing —
  // this page otherwise only shows community/personal move-frequency
  // stats, with no sense of whether the position is actually good. Reuses
  // the Analyze board's own endpoint; fire-and-forget from loadPosition()
  // above since it's slower than the explorer stats and shouldn't block
  // them. Request-id guarded the same way loadPosition() guards itself,
  // so clicking through several moves quickly can't have an old eval
  // response land after a newer position is already on screen. ----------

  const EVAL_CAP = 1000;
  let evalRequestId = 0;

  function formatEval(cp) {
    if (Math.abs(cp) >= 9000) return (cp > 0 ? "+" : "-") + "M";
    const pawns = (cp / 100).toFixed(2);
    return cp > 0 ? `+${pawns}` : pawns;
  }

  function updateEvalBar(cp, mateIn) {
    const fill = document.getElementById("explorer-eval-fill");
    const value = document.getElementById("explorer-eval-value");
    let pct, label;
    if (mateIn != null) {
      pct = mateIn > 0 ? 100 : 0;
      label = `${mateIn > 0 ? "" : "-"}M${Math.abs(mateIn)}`;
    } else {
      pct = Math.max(0, Math.min(100, ((cp + EVAL_CAP) / (2 * EVAL_CAP)) * 100));
      label = formatEval(cp);
    }
    fill.style.height = `${pct}%`;
    value.textContent = label;
  }

  async function loadEvalBar(fen) {
    const thisEvalRequestId = ++evalRequestId;
    document.getElementById("explorer-eval-caption").textContent = "Engine is thinking…";
    try {
      const res = await fetch("/api/analyze/fen", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fen }),
      });
      const data = await res.json();
      if (thisEvalRequestId !== evalRequestId) return; // superseded by a newer position
      if (!res.ok) { document.getElementById("explorer-eval-caption").textContent = ""; return; }

      const best = data.top_lines[0];
      const sideToMove = fen.split(" ")[1] === "w" ? "white" : "black";
      const sign = sideToMove === "white" ? 1 : -1;
      const cp = best ? best.eval_cp * sign : 0;
      const mateIn = best && best.mate_in != null ? best.mate_in * sign : null;
      updateEvalBar(cp, mateIn);
      document.getElementById("explorer-eval-caption").textContent =
        best ? `Engine's top choice: ${best.move_san}` : "";
    } catch {
      if (thisEvalRequestId === evalRequestId) document.getElementById("explorer-eval-caption").textContent = "";
    }
  }

  function isLightSquare(square) {
    const file = square.charCodeAt(0) - 97;
    const rank = parseInt(square[1], 10);
    return (file + rank) % 2 !== 0;
  }
  function squareOrder(orientation) {
    const files = "abcdefgh".split(""), ranks = [8,7,6,5,4,3,2,1];
    if (orientation === "black") { files.reverse(); ranks.reverse(); }
    const order = [];
    for (const r of ranks) for (const f of files) order.push(`${f}${r}`);
    return order;
  }

  let isLoading = false;
  let loadRequestId = 0;

  async function loadPosition() {
    // Guards against a stale click during the fetch window: a click on the
    // board or the candidate-moves table while a previous move's request
    // is still in flight would otherwise fire against DOM/data about to be
    // replaced (observed: double-appending a move to movePath). The
    // request id also drops the response of a now-superseded request if
    // two loads somehow overlap, so only the latest one ever renders.
    isLoading = true;
    const thisRequestId = ++loadRequestId;
    document.getElementById("board").classList.add("loading-disabled");
    document.getElementById("moves-body").classList.add("loading-disabled");
    document.getElementById("path-row").classList.add("loading-disabled");
    document.getElementById("mine-summary").innerHTML = `<span class="loading-text"><span class="spinner"></span>Loading…</span>`;
    document.getElementById("community-summary").innerHTML = `<span class="loading-text"><span class="spinner"></span>Loading…</span>`;

    try {
      const movesParam = movePath.map(m => m.uci).join(",");
      const res = await fetch(`/api/explorer?moves=${movesParam}`);
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || `Request failed (${res.status})`);
      }
      const data = await res.json();
      if (thisRequestId !== loadRequestId) return; // superseded by a newer load

      currentData = data;
      renderPath();
      renderBoard();
      renderStats();
      renderMovesTable();
      renderDivergence();
      loadEvalBar(data.fen); // fire-and-forget: Stockfish is slower than the
                             // explorer stats above, so this fills in the
                             // eval bar a moment later rather than blocking
                             // everything else on it.
    } catch (err) {
      if (thisRequestId !== loadRequestId) return; // superseded — a newer load owns the UI now
      document.getElementById("mine-summary").innerHTML = `<span class="loading-text">Couldn't load this position. ${escapeHtml(err.message || "")}</span>`;
      document.getElementById("community-summary").innerHTML = "";
    } finally {
      // Same supersession guard as above: only the still-current request
      // is allowed to clear the loading state a newer one already re-set.
      if (thisRequestId === loadRequestId) {
        isLoading = false;
        document.getElementById("board").classList.remove("loading-disabled");
        document.getElementById("moves-body").classList.remove("loading-disabled");
        document.getElementById("path-row").classList.remove("loading-disabled");
      }
    }
  }

  function renderPath() {
    const row = document.getElementById("path-row");
    row.innerHTML = "";
    const start = document.createElement("span");
    start.className = movePath.length === 0 ? "crumb" : "";
    start.textContent = "Starting position";
    start.style.cursor = "pointer";
    start.addEventListener("click", () => { movePath = []; loadPosition(); });
    row.appendChild(start);

    movePath.forEach((m, i) => {
      const sep = document.createElement("span");
      sep.className = "sep"; sep.textContent = "›";
      row.appendChild(sep);
      const crumb = document.createElement("span");
      crumb.textContent = m.san;
      crumb.style.cursor = "pointer";
      if (i === movePath.length - 1) crumb.className = "crumb";
      crumb.addEventListener("click", () => { movePath = movePath.slice(0, i + 1); loadPosition(); });
      row.appendChild(crumb);
    });

    const resetBtn = document.createElement("button");
    resetBtn.id = "reset-btn";
    resetBtn.textContent = "Reset";
    resetBtn.addEventListener("click", () => { movePath = []; loadPosition(); });
    row.appendChild(resetBtn);
  }

  function renderBoard() {
    const board = document.getElementById("board");
    board.innerHTML = "";
    selectedSquare = null;
    const pieceMap = fenToPieceMap(currentData.fen);
    const order = squareOrder(currentData.side_to_move);
    for (const square of order) {
      const el = document.createElement("div");
      el.className = `square ${isLightSquare(square) ? "light" : "dark"}`;
      el.dataset.square = square;
      const piece = pieceMap[square];
      if (piece) renderPieceIcon(el, piece);
      el.addEventListener("click", () => onSquareClick(square));
      board.appendChild(el);
    }
  }

  function ownPieceAt(square) {
    const pieceMap = fenToPieceMap(currentData.fen);
    const piece = pieceMap[square];
    if (!piece) return false;
    const isWhitePiece = piece === piece.toUpperCase();
    return (currentData.side_to_move === "white") === isWhitePiece;
  }

  function legalDestinationsFrom(square) {
    return currentData.legal_moves
      .filter(m => m.uci.startsWith(square))
      .map(m => ({ to: m.uci.slice(2, 4), uci: m.uci, san: m.san }));
  }

  function clearHighlights() {
    document.querySelectorAll(".square.selected").forEach(el => el.classList.remove("selected"));
    document.querySelectorAll(".legal-dot").forEach(el => el.remove());
  }

  function onSquareClick(square) {
    if (isLoading) return;
    if (selectedSquare) {
      const dests = legalDestinationsFrom(selectedSquare);
      const match = dests.find(d => d.to === square);
      if (match) { playMove(match.uci, match.san); return; }
    }
    clearHighlights();
    if (ownPieceAt(square)) {
      selectedSquare = square;
      document.querySelector(`.square[data-square="${square}"]`).classList.add("selected");
      for (const d of legalDestinationsFrom(square)) {
        const destEl = document.querySelector(`.square[data-square="${d.to}"]`);
        const dot = document.createElement("div");
        dot.className = "legal-dot";
        destEl.appendChild(dot);
      }
    } else {
      selectedSquare = null;
    }
  }

  function playMove(uci, san) {
    if (isLoading) return;
    movePath.push({ uci, san });
    loadPosition();
  }

  function renderStats() {
    const mine = currentData.mine;
    const mineEl = document.getElementById("mine-summary");
    if (!mine.games_reached) {
      mineEl.innerHTML = `<p class="empty-note">You haven't reached this position in any analyzed game.</p>`;
    } else {
      const total = mine.games_reached;
      mineEl.innerHTML = `
        <div style="font-size:22px; font-weight:700;">${mine.win_rate_pct}%<span style="font-size:12px; font-weight:400; color:var(--text-secondary);"> win rate</span></div>
        <div class="wdl-bar">
          <span class="win" style="width:${mine.wins/total*100}%"></span>
          <span class="draw" style="width:${mine.draws/total*100}%"></span>
          <span class="loss" style="width:${mine.losses/total*100}%"></span>
        </div>
        <div class="wdl-caption">${total} game${total===1?"":"s"} · ${mine.wins}W ${mine.draws}D ${mine.losses}L</div>
      `;
    }

    const community = currentData.community;
    const commEl = document.getElementById("community-summary");
    if (!community.available) {
      commEl.innerHTML = `<p class="empty-note">Community reference data unavailable right now.</p>`;
    } else {
      const total = community.white + community.draws + community.black;
      if (!total) {
        commEl.innerHTML = `<p class="empty-note">No community games recorded at this exact position.</p>`;
      } else {
        const openingName = community.opening ? escapeHtml(community.opening.name) : "";
        commEl.innerHTML = `
          ${openingName ? `<div style="font-size:12px; color:var(--text-secondary); margin-bottom:4px;">${openingName}</div>` : ""}
          <div class="wdl-bar">
            <span class="win" style="width:${community.white/total*100}%"></span>
            <span class="draw" style="width:${community.draws/total*100}%"></span>
            <span class="loss" style="width:${community.black/total*100}%"></span>
          </div>
          <div class="wdl-caption">${total.toLocaleString()} games · White ${Math.round(community.white/total*100)}% / Draw ${Math.round(community.draws/total*100)}% / Black ${Math.round(community.black/total*100)}%</div>
        `;
      }
    }
  }

  function renderMovesTable() {
    const body = document.getElementById("moves-body");
    const mineByUci = Object.fromEntries(currentData.mine.my_moves.map(m => [m.uci, m]));
    const commByUci = Object.fromEntries(currentData.community.moves.map(m => [m.uci, m]));
    const allUcis = new Set([...Object.keys(mineByUci), ...Object.keys(commByUci)]);

    if (!allUcis.size) {
      body.innerHTML = `<tr><td colspan="5" class="empty-note">No move data at this position.</td></tr>`;
      return;
    }

    const rows = [...allUcis].map(uci => {
      const mine = mineByUci[uci];
      const comm = commByUci[uci];
      const san = (mine && mine.san) || (comm && comm.san) || uci;
      return { uci, san, mine, comm };
    });
    rows.sort((a, b) => (b.comm ? b.comm.total : 0) - (a.comm ? a.comm.total : 0) || (b.mine ? b.mine.count : 0) - (a.mine ? a.mine.count : 0));

    body.innerHTML = rows.map(r => `
      <tr class="move-choice" data-uci="${r.uci}" data-san="${escapeHtml(r.san)}">
        <td><strong>${escapeHtml(r.san)}</strong></td>
        <td>${r.mine ? r.mine.count : "–"}</td>
        <td>${r.mine ? r.mine.win_rate_pct + "%" : "–"}</td>
        <td>${r.comm ? r.comm.total_pct + "%" : "–"}</td>
        <td>${r.comm ? r.comm.win_rate_pct + "%" : "–"}</td>
      </tr>
    `).join("");

    body.querySelectorAll(".move-choice").forEach(row => {
      row.addEventListener("click", () => playMove(row.dataset.uci, row.dataset.san));
    });
  }

  function renderDivergence() {
    const card = document.getElementById("divergence-card");
    const list = document.getElementById("divergence-list");
    const flags = currentData.divergence;
    if (!flags || !flags.length) { card.classList.add("hidden"); return; }
    card.classList.remove("hidden");
    list.innerHTML = flags.map(f => `
      <div class="divergence-item">
        The community plays <strong>${escapeHtml(f.move_san)}</strong> ${f.community_pct}% of the time here,
        winning ${f.community_win_rate_pct}% — you've only tried it ${f.my_pct}% of the time.
      </div>
    `).join("");
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s ?? "";
    return div.innerHTML;
  }

  function applyTheme(theme) {
    if (theme === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
  }
  applyTheme(localStorage.getItem("theme") || "system");
  document.getElementById("theme-toggle").addEventListener("click", () => {
    const current = localStorage.getItem("theme") || "system";
    const next = current === "system" ? "light" : current === "light" ? "dark" : "system";
    localStorage.setItem("theme", next);
    applyTheme(next);
  });

  // Nav dropdowns (Train / Insights groups) — one open at a time, closes
  // on an outside click or Escape. Duplicated identically across every
  // page (no shared JS include in this app), same as the theme toggle above.
  document.querySelectorAll(".nav-dropdown-toggle").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const dropdown = btn.closest(".nav-dropdown");
      const wasOpen = dropdown.classList.contains("open");
      document.querySelectorAll(".nav-dropdown.open").forEach(d => {
        d.classList.remove("open");
        d.querySelector(".nav-dropdown-toggle").setAttribute("aria-expanded", "false");
      });
      if (!wasOpen) {
        dropdown.classList.add("open");
        btn.setAttribute("aria-expanded", "true");
      }
    });
  });
  document.addEventListener("click", () => {
    document.querySelectorAll(".nav-dropdown.open").forEach(d => {
      d.classList.remove("open");
      d.querySelector(".nav-dropdown-toggle").setAttribute("aria-expanded", "false");
    });
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      document.querySelectorAll(".nav-dropdown.open").forEach(d => {
        d.classList.remove("open");
        d.querySelector(".nav-dropdown-toggle").setAttribute("aria-expanded", "false");
      });
    }
  });

  loadPosition();
</script>
</body>
</html>
