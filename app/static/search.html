<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chesswise — Search</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♟️</text></svg>">
<style>
  /* Dark (Catppuccin Mocha) is the default regardless of OS
     preference — Mokka's look is a deliberate, chosen theme, not
     something that should silently flip to light just because the
     system prefers it. "System" in the theme-toggle cycle below
     therefore renders identically to "dark"; :root[data-theme="light"]
     is the only way to opt into the light (Latte) palette. */
  :root {
    color-scheme: dark;
    --surface-1: #1c2e3c;
    --surface-1-glass: rgba(28,46,60,0.72);
    --page-plane: #131f29;
    --text-primary: #dfe8ed;
    --text-secondary: #a8bcc7;
    --text-muted: #748994;
    --gridline: #2c4356;
    --baseline: #3c5b70;
    --border: rgba(223,232,237,0.14);
    --series-1: #7fabc4; /* muted sky blue — bar chart, lichess badge */
    --series-2: #d3a077; /* muted clay — chesscom badge, deliberate warm counterpoint */
    --status-critical: #e2707f; /* blunder */
    --status-critical-text: #2a0011;
    --status-serious: #e58f95; /* mistake */
    --status-warning: #e6bf78; /* inaccuracy */
    --status-good: #7fbd96;
    --accent: #6b9bb8; /* muted steel-sky accent */
    --accent-soft: rgba(107,155,184,0.18);
    --accent-glow: rgba(107,155,184,0.35);
    --bg-art: linear-gradient(180deg, #0f1922 0%, #16242f 55%, #1e3140 100%);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --surface-1: #ffffff;
    --surface-1-glass: rgba(255,255,255,0.75);
    --page-plane: #eef2f5;
    --text-primary: #2b3c46;
    --text-secondary: #57707d;
    --text-muted: #869aa5;
    --gridline: #d7e2e8;
    --baseline: #b3c5cf;
    --border: rgba(43,60,70,0.14);
    --series-1: #5a8aa6;
    --series-2: #cd8552;
    --status-critical: #c94d5f;
    --status-critical-text: #ffffff;
    --status-serious: #d4737f;
    --status-warning: #c68c33;
    --status-good: #4a9268;
    --accent: #4d84a3;
    --accent-soft: rgba(77,132,163,0.14);
    --accent-glow: rgba(77,132,163,0.28);
    --bg-art: linear-gradient(180deg, #eef2f5 0%, #e3ebef 55%, #d7e2e8 100%);
  }

  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0;
    min-height: 100vh;
    background-image: var(--bg-art);
    background-size: cover;
    background-position: bottom center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-color: var(--page-plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 28px 40px 64px;
  }
  .page { max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  header.top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  h1 { font-size: 20px; margin: 0; }
  nav.top-nav a {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 13px;
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    transition: background .15s, color .15s, border-color .15s;
  }
  nav.top-nav a:hover { background: var(--accent-soft); color: var(--text-primary); border-color: transparent; }
  nav.top-nav a.active { background: var(--accent); color: #fff; border-color: transparent; }
  .nav-dropdown { position: relative; display: inline-block; }
  .nav-dropdown-toggle {
    font: inherit; font-size: 13px; padding: 7px 14px; border: 1px solid var(--border);
    border-radius: 999px; background: none; color: var(--text-secondary); cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .nav-dropdown-toggle:hover { background: var(--accent-soft); color: var(--text-primary); border-color: transparent; }
  .nav-dropdown-toggle.active-section { background: var(--accent); color: #fff; border-color: transparent; }
  .nav-dropdown-menu {
    display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 30;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 6px; min-width: 150px; box-shadow: 0 12px 32px rgba(17,17,26,0.25);
  }
  .nav-dropdown.open .nav-dropdown-menu { display: block; }
  .nav-dropdown-menu a {
    display: block; padding: 8px 12px; border-radius: 8px; font-size: 13px;
    color: var(--text-secondary); text-decoration: none; white-space: nowrap;
  }
  .nav-dropdown-menu a:hover { background: var(--accent-soft); color: var(--text-primary); }
  .nav-dropdown-menu a.active { background: var(--accent); color: #fff; }
  .icon-btn {
    font: inherit; font-size: 15px; width: 34px; height: 34px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); cursor: pointer;
  }
  .icon-btn:hover:not(:disabled) { background: var(--accent-soft); border-color: transparent; }
  .card {
    background: var(--surface-1-glass);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    min-width: 0;
    box-shadow: 0 1px 2px rgba(17, 17, 26, 0.06), 0 24px 48px -24px var(--accent-glow);
  }

  .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .filter-grid label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--text-secondary); }
  .filter-grid input, .filter-grid select {
    font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--page-plane); color: var(--text-primary);
  }
  .filter-actions { margin-top: 14px; display: flex; gap: 10px; align-items: center; }
  .filter-actions button {
    font: inherit; font-size: 13px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary); cursor: pointer;
  }
  .profile-select {
    font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); cursor: pointer;
  }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 16px; }
  .stat-tile .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .stat-tile .value { font-size: 24px; font-weight: 600; }

  .table-scroll { overflow-x: auto; width: 100%; max-width: 100%; }
  table.data-table { width: 100%; min-width: 560px; border-collapse: collapse; font-size: 13px; }
  table.data-table th {
    text-align: left; font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 600;
    padding: 0 10px 8px; border-bottom: 1px solid var(--gridline); cursor: pointer; white-space: nowrap;
  }
  table.data-table td { padding: 9px 10px; border-bottom: 1px solid var(--gridline); font-variant-numeric: tabular-nums; }
  table.data-table tbody tr { cursor: pointer; }
  table.data-table tbody tr:hover { background: var(--page-plane); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
    padding: 3px 8px; border-radius: 100px; color: #fff;
  }
  .badge.lichess { background: var(--series-1); }
  .badge.chesscom { background: var(--series-2); }
  .badge.manual { background: var(--text-muted); }
  .blunder-count { color: var(--status-critical); font-weight: 600; }
  .empty-note { color: var(--text-secondary); font-size: 13px; }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1>Search games</h1>
    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <nav class="top-nav">
        <a href="/">Dashboard</a>
        <a href="/puzzles">Puzzles</a>
        <div class="nav-dropdown">
          <button type="button" class="nav-dropdown-toggle" aria-haspopup="true" aria-expanded="false">Train ▾</button>
          <div class="nav-dropdown-menu">
            <a href="/explorer">Explorer</a>
            <a href="/endgame">Endgame</a>
            <a href="/analyze">Analyze</a>
          </div>
        </div>
        <div class="nav-dropdown">
          <button type="button" class="nav-dropdown-toggle" aria-haspopup="true" aria-expanded="false">Insights ▾</button>
          <div class="nav-dropdown-menu">
            <a href="/insights">Insights</a>
            <a href="/clock">Clock</a>
            <a href="/progress">Progress</a>
          </div>
        </div>
        <a href="/search" class="active">Search</a>
      </nav>
      <select class="profile-select" id="profile-select" title="Profile"><option value="">All profiles</option></select>
      <a class="icon-btn" href="/profiles" title="Manage profiles" aria-label="Manage profiles" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center;">👤</a>
      <button class="icon-btn" id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
    </div>
  </header>

  <section class="card">
    <div class="filter-grid">
      <label>Opponent<input type="text" id="f-opponent" placeholder="name contains…"></label>
      <label>Opening<input type="text" id="f-opening" placeholder="name contains…"></label>
      <label>From<input type="date" id="f-date-from"></label>
      <label>To<input type="date" id="f-date-to"></label>
      <label>Result
        <select id="f-result"><option value="">Any</option><option value="win">Win</option><option value="loss">Loss</option><option value="draw">Draw</option></select>
      </label>
      <label>Color
        <select id="f-color"><option value="">Any</option><option value="white">White</option><option value="black">Black</option></select>
      </label>
      <label>Time control
        <select id="f-time-control"><option value="">Any</option><option value="bullet">Bullet</option><option value="blitz">Blitz</option><option value="rapid">Rapid</option><option value="classical">Classical</option><option value="daily">Daily</option></select>
      </label>
      <label>Site
        <select id="f-source"><option value="">Any</option><option value="lichess">Lichess</option><option value="chesscom">Chess.com</option><option value="manual">Manual</option></select>
      </label>
      <label>Blunders
        <select id="f-has-blunder"><option value="">Any</option><option value="true">Contains a blunder</option><option value="false">No blunders</option></select>
      </label>
    </div>
    <div class="filter-actions">
      <button id="clear-btn">Clear filters</button>
      <span class="empty-note" id="result-count"></span>
      <span style="flex:1"></span>
      <button id="export-games-csv">Export CSV</button>
      <button id="export-games-json">Export JSON</button>
      <button id="export-stats-json">Export stats JSON</button>
    </div>
  </section>

  <section class="card">
    <h2 style="font-size:14px; margin:0 0 14px;">Stats for this view</h2>
    <div class="stat-row" id="stat-row"></div>
  </section>

  <section class="card">
    <div class="table-scroll">
      <table class="data-table">
        <thead>
          <tr>
            <th data-sort="date">Date</th>
            <th>Site</th>
            <th data-sort="opponent">Opponent</th>
            <th>Color</th>
            <th data-sort="result">Result</th>
            <th>Time control</th>
            <th>Opening</th>
            <th data-sort="mistakes">Mistakes</th>
            <th data-sort="blunders">Blunders</th>
          </tr>
        </thead>
        <tbody id="results-body"><tr><td colspan="9" class="empty-note">Loading…</td></tr></tbody>
      </table>
    </div>
  </section>
</div>

<script>
  let sortBy = "date", sortDir = "desc";
  let debounceHandle = null;
  let currentProfileId = localStorage.getItem("profileId") || "";

  function currentFilters() {
    return {
      opponent: document.getElementById("f-opponent").value.trim(),
      opening: document.getElementById("f-opening").value.trim(),
      date_from: document.getElementById("f-date-from").value,
      date_to: document.getElementById("f-date-to").value,
      result: document.getElementById("f-result").value,
      color: document.getElementById("f-color").value,
      time_control: document.getElementById("f-time-control").value,
      source: document.getElementById("f-source").value,
      profile_id: currentProfileId,
      has_blunder: document.getElementById("f-has-blunder").value,
    };
  }

  async function loadProfileOptions() {
    const select = document.getElementById("profile-select");
    try {
      const profiles = await fetch("/api/profiles").then(r => r.json());
      select.innerHTML = `<option value="">All profiles</option>` +
        profiles.map(p => `<option value="${p.id}">${escapeHtml(p.name)} (${p.game_count})</option>`).join("");
      if (currentProfileId && profiles.some(p => String(p.id) === currentProfileId)) {
        select.value = currentProfileId;
      } else {
        currentProfileId = "";
        localStorage.removeItem("profileId");
      }
    } catch {
      // Profiles are a nice-to-have filter — a failed fetch here shouldn't
      // block search from working.
    }
  }

  document.getElementById("profile-select").addEventListener("change", () => {
    currentProfileId = document.getElementById("profile-select").value;
    if (currentProfileId) localStorage.setItem("profileId", currentProfileId);
    else localStorage.removeItem("profileId");
    runSearch();
  });

  let searchRequestId = 0;

  async function runSearch() {
    const filters = currentFilters();
    const params = new URLSearchParams({ sort_by: sortBy, sort_dir: sortDir });
    for (const [k, v] of Object.entries(filters)) if (v) params.set(k, v);

    // Text filters debounce, but selects/dates fire runSearch() immediately
    // — two overlapping requests (e.g. typing an opponent name then
    // quickly changing the Result dropdown) could otherwise resolve out of
    // order and let the older, now-stale response overwrite the table
    // with results that don't match the current filters. Same
    // request-id-supersession guard explorer.html's loadPosition uses for
    // the identical reason.
    const thisRequestId = ++searchRequestId;
    try {
      const res = await fetch(`/api/search?${params}`);
      if (!res.ok) throw new Error(`Request failed (${res.status})`);
      const data = await res.json();
      if (thisRequestId !== searchRequestId) return; // superseded by a newer search

      renderStats(data.stats);
      renderResults(data.games);
      document.getElementById("result-count").textContent = `${data.games.length} game${data.games.length === 1 ? "" : "s"}`;
    } catch (err) {
      if (thisRequestId !== searchRequestId) return;
      document.getElementById("results-body").innerHTML =
        `<tr><td colspan="9" class="empty-note">Couldn't load results — check your connection and try again.</td></tr>`;
    }
  }

  function renderStats(stats) {
    const row = document.getElementById("stat-row");
    const phaseText = Object.entries(stats.by_phase).map(([p, n]) => `${p}: ${n}`).join(", ") || "–";
    row.innerHTML = `
      <div class="stat-tile"><div class="label">Games</div><div class="value">${stats.total_games}</div></div>
      <div class="stat-tile"><div class="label">Mistakes</div><div class="value">${stats.total_mistakes}</div></div>
      <div class="stat-tile"><div class="label">Blunders/game</div><div class="value">${stats.avg_blunders_per_game}</div></div>
      <div class="stat-tile"><div class="label">Blunders, % of mistakes</div><div class="value">${stats.blunders_pct_of_mistakes}%</div></div>
      <div class="stat-tile"><div class="label">By phase</div><div class="value" style="font-size:13px; font-weight:400;">${phaseText}</div></div>
    `;
  }

  function renderResults(games) {
    const body = document.getElementById("results-body");
    if (!games.length) {
      body.innerHTML = `<tr><td colspan="9" class="empty-note">No games match these filters.</td></tr>`;
      return;
    }
    body.innerHTML = games.map(g => {
      const date = new Date(g.date).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric", timeZone: "UTC" });
      const badgeClass = g.source === "lichess" ? "lichess" : g.source === "chesscom" ? "chesscom" : "manual";
      const badgeLabel = g.source === "lichess" ? "Lichess" : g.source === "chesscom" ? "Chess.com" : "Manual";
      return `
        <tr data-id="${g.id}">
          <td>${date}</td>
          <td><span class="badge ${badgeClass}">${badgeLabel}</span></td>
          <td>${escapeHtml(g.opponent)}</td>
          <td>${g.color}</td>
          <td>${g.result}</td>
          <td>${g.time_control}</td>
          <td>${escapeHtml(g.opening_name || "–")}</td>
          <td>${g.mistake_count}</td>
          <td class="${g.blunder_count > 0 ? "blunder-count" : ""}">${g.blunder_count}</td>
        </tr>
      `;
    }).join("");
    body.querySelectorAll("tr[data-id]").forEach(row => {
      row.addEventListener("click", () => { window.location.href = `/game?id=${row.dataset.id}`; });
    });
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s ?? "";
    return div.innerHTML;
  }

  document.querySelectorAll("[data-sort]").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.sort;
      if (sortBy === key) sortDir = sortDir === "asc" ? "desc" : "asc";
      else { sortBy = key; sortDir = "desc"; }
      runSearch();
    });
  });

  document.querySelectorAll(".filter-grid select").forEach(el => el.addEventListener("change", runSearch));
  document.querySelectorAll(".filter-grid input[type='date']").forEach(el => el.addEventListener("change", runSearch));
  document.querySelectorAll(".filter-grid input[type='text']").forEach(el => {
    el.addEventListener("input", () => {
      clearTimeout(debounceHandle);
      debounceHandle = setTimeout(runSearch, 350);
    });
  });

  document.getElementById("clear-btn").addEventListener("click", () => {
    document.querySelectorAll(".filter-grid input, .filter-grid select").forEach(el => el.value = "");
    runSearch();
  });

  function exportUrl(path) {
    const filters = currentFilters();
    const params = new URLSearchParams({ sort_by: sortBy, sort_dir: sortDir });
    for (const [k, v] of Object.entries(filters)) if (v) params.set(k, v);
    return `${path}?${params}`;
  }

  document.getElementById("export-games-csv").addEventListener("click", () => {
    window.location.href = exportUrl("/api/export/games") + "&format=csv";
  });
  document.getElementById("export-games-json").addEventListener("click", () => {
    window.location.href = exportUrl("/api/export/games") + "&format=json";
  });
  document.getElementById("export-stats-json").addEventListener("click", () => {
    window.location.href = exportUrl("/api/export/stats");
  });

  function applyTheme(theme) {
    if (theme === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
  }
  applyTheme(localStorage.getItem("theme") || "system");
  document.getElementById("theme-toggle").addEventListener("click", () => {
    const current = localStorage.getItem("theme") || "system";
    const next = current === "system" ? "light" : current === "light" ? "dark" : "system";
    localStorage.setItem("theme", next);
    applyTheme(next);
  });

  // Nav dropdowns (Train / Insights groups) — one open at a time, closes
  // on an outside click or Escape. Duplicated identically across every
  // page (no shared JS include in this app), same as the theme toggle above.
  document.querySelectorAll(".nav-dropdown-toggle").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const dropdown = btn.closest(".nav-dropdown");
      const wasOpen = dropdown.classList.contains("open");
      document.querySelectorAll(".nav-dropdown.open").forEach(d => {
        d.classList.remove("open");
        d.querySelector(".nav-dropdown-toggle").setAttribute("aria-expanded", "false");
      });
      if (!wasOpen) {
        dropdown.classList.add("open");
        btn.setAttribute("aria-expanded", "true");
      }
    });
  });
  document.addEventListener("click", () => {
    document.querySelectorAll(".nav-dropdown.open").forEach(d => {
      d.classList.remove("open");
      d.querySelector(".nav-dropdown-toggle").setAttribute("aria-expanded", "false");
    });
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      document.querySelectorAll(".nav-dropdown.open").forEach(d => {
        d.classList.remove("open");
        d.querySelector(".nav-dropdown-toggle").setAttribute("aria-expanded", "false");
      });
    }
  });

  loadProfileOptions();
  runSearch();
</script>
</body>
</html>
